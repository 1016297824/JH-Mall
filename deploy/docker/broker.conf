# RocketMQ Broker 配置（本地开发）
#
# 关键项 brokerIP1：broker 默认注册到 NameServer 的是容器内网 IP（如 172.18.0.6），
# 而本地开发时 Java 服务跑在宿主机上，宿主机无法访问 docker 网段，
# 生产者会卡在 sendDefaultImpl 直到超时（RemotingTooMuchRequestException），
# 表现为「消息永远发不出去、Outbox 重试 3 次后 FAILED」。
#
# broker 的 10911 已通过 docker-compose 映射到宿主机，故对外通告 127.0.0.1 即可。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 本地开发省去手工建 Topic 的步骤
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
